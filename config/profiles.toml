# ---------------------------------------------------------------------------
# Platforms. `type` names the code in scripts/sources.py that asks and reads
# them. A url with {query} is sent once for each query of the profiles of the
# same kind, or for each of the platform's own `queries` if it has them (category
# pages on Nature and THE, landing pages at Berkeley Lab), page by page ({page}
# counts from 1, {page0} from 0) until a page adds nothing new or `pages` is
# reached. A url without {query} is read whole and every posting in it is scored.
#   score = false   list every new posting, unscored (Greek-language feeds,
#                   where English keywords cannot judge a title); with `keep`,
#                   only titles that contain one of its words
#   min_score = n   overrides settings.min_score for postings from this platform
#   enabled = false  the platform is not asked (its reader and tests stay)
# Checked by hand on 16 October 2026, and again on 11 November 2026 against
# robots.txt, with the boards that callaband.github.io/microbiome-faculty-jobs reads;
# README.md says why each one is here and which platforms were tried and left out.
# ---------------------------------------------------------------------------

[[sources]]
id = "euraxess"
name = "EURAXESS jobs"
kind = "job"
type = "euraxess"
url = "https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3A{query}&page={page0}"
pages = 2
enabled = false              # off since 11 November 2026: its robots.txt (changed 10 November) disallows
                             # /jobs/* and every URL with parameters. Ask support@euraxess.org for
                             # permission or an export; set true again only with their agreement

[[sources]]
id = "nature"
name = "Nature Careers"
kind = "job"
type = "madgex"
url = "https://www.nature.com/naturecareers/jobs/{query}/"
queries = ["postdoctoral", "life-science/researcher", "environmental-science/researcher"]
pages = 15                   # 20 a page; "postdoctoral" had 14 pages on 11 November 2026. Its robots.txt
                             # disallows the keyword RSS used before (/naturecareers/jobsrss/), not these pages

[[sources]]
id = "science"
name = "Science Careers"
kind = "job"
type = "rss"
url = "https://jobs.sciencecareers.org/jobsrss/?keywords={query}&page={page}"
title_has_employer = true
pages = 1

[[sources]]
id = "the"
name = "Times Higher Education jobs"
kind = "job"
type = "madgex"
url = "https://www.timeshighereducation.com/unijobs/listings/{query}/"
queries = ["research-related"]   # postdoc, research fellow and research associate posts, every subject
pages = 8                    # 6 pages on 11 November 2026; robots.txt disallows THE's job RSS, not this

[[sources]]
id = "jobs-ac-uk"
name = "jobs.ac.uk"
kind = "job"
type = "jobs_ac_uk"
url = "https://www.jobs.ac.uk/search/?keywords={query}&sortOrder=1&pageSize=100"
pages = 1

[[sources]]
id = "jobrxiv"
name = "jobRxiv"
kind = "job"
type = "rss"
url = "https://jobrxiv.org/?feed=job_feed&search_keywords={query}&posts_per_page=50"
pages = 1                    # the board's search as RSS, with employer and country

[[sources]]
id = "fems"
name = "FEMS jobs (microbiology)"
kind = "job"
type = "rss"
url = "https://fems-microbiology.org/categories/jobs/feed/"
title_employer_after = " – "   # some titles read "Job title – Employer"

[[sources]]
id = "mpg"
name = "Max Planck Society"
kind = "job"
type = "rss"
url = "https://www.mpg.de/feeds/jobs.rss"
