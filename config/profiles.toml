# What to look for and where: the vocabulary of the job-postings alerts.
#
# Written by hand, from the CV in examples/kgfp_paragkamian.pdf. The scripts
# read this file and never change it. Tune it after a few runs: the counts
# per platform and query are in provenance/<date>.log.md, and
#   python3 scripts/run.py --no-fetch
# rescores the day's saved answers with the file as it is now.
#
# How a posting is scored against a profile of the same kind:
#   score = title_weight x (keywords found in the title)
#         + 1 x (keywords found in the organisation or the summary)
# It is listed under the best-scoring profile that reaches min_score (the
# other profiles it reaches are named next to it). A profile with `require`
# counts only postings that also mention one of those words anywhere: an AI
# post must touch biology or the environment to count as biodiversity informatics.
#
# How keywords match (scripts/common.py, class Terms):
#   - whole words or phrases only: "cave" does not match "caveat";
#   - a trailing * matches any ending: "metagenom*" matches "metagenomics";
#   - a keyword written in capitals is case-sensitive: "MAG" does not match
#     "magnetic", "FAIR" does not match "a fair salary";
#   - accents are ignored, and a space or hyphen inside a keyword matches a
#     space, a hyphen or nothing: "multi-omic*" matches "multiomics".

[settings]
min_score = 3            # one keyword in the title, or three in the text
title_weight = 3
max_per_profile = 40     # listed per profile on a page; the rest are counted
keep_days = 30           # open.md keeps a posting without a deadline this long after it was last seen
new_days = 7             # marked new in open.md for this many days
forget_days = 365        # data/seen.csv drops postings not seen for this long
raw_days = 14            # saved answers (data/raw, data/postings) are deleted after this many days;
                         # they are needed only to rescore a recent day, and take about 14 MB a day
delay_seconds = 1        # pause after every request
notify = true            # desktop notification (osascript on macOS, notify-send on Linux) when a run finds something new
contact = ""             # optional e-mail for the User-Agent header (polite towards APIs); empty sends none
skip_stages = ["R1"]     # EURAXESS offers open only to first-stage researchers (doctoral candidates) are
                         # skipped, unless the title says postdoc (some employers mark postdocs R1)

# Titles containing any of these are never listed (titles only: a postdoc
# advert may well mention the PhD students you would supervise). The second
# line of `job` keeps out medicine and finance, which share words with the
# profiles (microbiome, AI, data) but not their subject.
[exclude]
job = ["PhD student*", "PhD position*", "PhD candidate*", "PhD scholarship*", "PhD fellowship*", "PhD program*",
       "doctoral candidate*", "doctoral researcher*", "doctoral student*", "doctoral position*", "doctoral program*",
       "graduate student*", "master*", "internship*", "intern", "trainee*", "traineeship*", "student assistant*",
       "cancer", "oncolog*", "clinical", "immunolog*", "immunotherap*", "patient*", "medicine", "medical",
       "biomedic*", "healthcare", "drug discovery", "nurse", "nursing", "financ*"]
funding = ["PhD scholarship*", "PhD fellowship*", "PhD studentship*", "doctoral scholarship*",
           "master*", "undergraduate", "tender*", "procurement"]

# ---------------------------------------------------------------------------
# Profiles: five ways the CV reads to an employer or a funder. `queries` are
# sent to the platforms that search (Science, jobs.ac.uk, jobRxiv, EU Funding &
# Tenders; EURAXESS when it is on); `keywords` score every posting, whichever
# platform it came from.
# `cv` says why the profile fits and is printed above its list; `example` is
# the posting in examples/ that it was modelled on. Left out on purpose, after
# the first run listed antibody design and cognitive science: "AI", "machine
# learning", "data science" and a bare "modelling", which fit any field.
# ---------------------------------------------------------------------------

