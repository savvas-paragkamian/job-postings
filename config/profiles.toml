type = "selectminds"
url = "https://lbl.referrals.selectminds.com/{query}"
queries = ["page/jgi-job-openings-68", "landingpages/postdoctoral-fellow-opportunities-at-lbl-12"]
organisation = "Berkeley Lab"
pages = 1                    # newest 10 of each page; later pages are loaded by script. robots.txt allows all

[[sources]]
id = "ajo"
name = "Academic Jobs Online"
kind = "job"
type = "rss"
url = "https://academicjobsonline.org/ajo?joblist-0-0-0-----rss--"   # every open advert, about 360, 2 MB

[[sources]]
id = "embl"
